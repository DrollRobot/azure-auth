site_name: azure-auth
site_description: Authentication helpers and thin clients for Microsoft cloud services
repo_url: https://github.com/DrollRobot/azure-auth

theme:
  name: material
  features:
    - navigation.sections     # collapsible sections in left nav
    - navigation.expand       # expand all by default
    - content.code.copy       # copy button on code blocks
    - search.highlight

nav:
  - Home: index.md
  - Guide: guide.md
  - Reference:
      - Authentication: reference/auth.md
      - Clients: reference/clients.md
      - Blocking clients: reference/sync.md

markdown_extensions:
  - admonition                # !!! note style callouts
  - pymdownx.superfences      # fenced code with language detection
  - pymdownx.highlight        # syntax highlighting
  - pymdownx.inlinehilite     # inline `code` highlighting
  - toc:
      permalink: true         # ¶ link on each heading

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
