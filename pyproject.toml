[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { azure_auth = ["py.typed"] }

[project]
name = "azure-auth"
version = "0.13.0"
description = "A collection of clients and helper functions for authentication with Azure, Graph, Exchange, and other Microsoft cloud systems."
readme = "README.md"
requires-python = ">=3.11.18"
dependencies = [
    "azure-core>=1.41.0",
    "cryptography>=50.0.1",
    "httpx2>=2.16.0",
    "msal>=1.39.0",
    "msal-extensions>=1.3.1",
    "platformdirs>=4.11.7",
    "requests>=2.34.2",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",  # GHSA-xvg9-69gf-fjrf
    "mkdocstrings[python]>=1.0.4,<2",
]
test = [
    "azure-mgmt-resource-subscriptions>=1.0,<2",
    "keyring>=25.7,<26",
    "pytest>=9.0.3,<10",  # GHSA-6w46-j5rx-g56g
    "pytest-cov>=7.1,<8",
]
secrets = [
    "detect-secrets>=1.5,<2",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    {include-group = "secrets"},
    "debugpy>=1.8,<2",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "pre-commit-hooks>=6.0,<7",
    "ruff>=0.15,<1",
    "types-requests>=2.32,<3",
    "vulture>=2.16,<3",
]

[tool.uv]
# Oldest uv that can install the Python versions CI tests. CI installs the
# newest uv that meets it; local uv refuses to run if older.
required-version = ">=0.13.7"
constraint-dependencies = [
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5; prune when upstream requires it
    "certifi>=2026.10.19",  # GHSA-6q48-6c7w-9gw2; prune when requests requires it
    "virtualenv>=21.14.9",  # GHSA-hhxq-47xx-j5xx and 11 more; prune when upstream requires it
]

[tool.uv.extra-build-variables]
# PyYAML has no prebuilt cp315 wheel, so on that Python it builds from source, and
# its optional C extension needs a compiler (MSVC on Windows). Build it as pure Python.
# Remove once PyYAML publishes a cp315 wheel.
pyyaml = { PYYAML_FORCE_LIBYAML = "0" }

[project.optional-dependencies]
keyvault = [
    "aiohttp>=3.14.4",
    "azure-keyvault-certificates>=4.11.2",
    "azure-keyvault-keys>=4.11.2",
    "azure-keyvault-secrets>=4.11.2",
]
broker = [
    # pymsalruntime, the broker runtime, has no build for Python 3.15 yet (0.20.7,
    # 2026-11-20). Drop the marker once it does.
    "msal[broker]>=1.39.0; python_version < '3.15'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=azure_auth",
    "--cov=scripts",
    "--cov-report=term-missing",
    # The Windows certificate signer only runs under --run-destructive-local, and not at
    # all on other platforms, so the floor leaves room for it.
    "--cov-fail-under=85",
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: single function/class in isolation; all dependencies mocked or stubbed",
    "integration: multiple real components wired together across a boundary",
    "e2e: whole application end to end, driven like a real user",
    "smoke: fast 'is it fundamentally broken' check",
    "regression: guards against reintroduction of a previously fixed bug",
    "acceptance: verifies behavior against a requirement or user-facing spec",
    "functional: tests behavior/output of a feature without regard to internal structure",
    "live: requires a real external resource (network, live tenant, secrets, third-party API)",
    "interactive: requires a human at this desktop to complete a sign-in prompt",
    "cached_credential: tests signing in from the cache; runs after the other live tests",
    "destructive_local: mutates the host/device; guarded to prevent accidental execution",
    "destructive_remote: mutates a remote/external system; guarded to prevent accidental execution",
    "grant_when_possible: changes a GDAP customer tenant's consent grant; needs --grant-when-possible",
    "slow: long-running",
]

[tool.ruff]
line-length = 100
# No target-version: ruff takes it from requires-python.

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
# no docstrings/annotations in tests; assert is fine; S105-S107 flag every fake token
"tests/**" = ["D", "ANN", "S101", "S105", "S106", "S107"]
".local/tests/**" = ["D", "ANN", "S101", "S105", "S106", "S107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src",
    "tests",
    "scripts",
]
mypy_path = [
    "scripts",
]

# AGENTS: ONLY ADD OVERRIDES IF, AFTER RESEARCHING, THERE IS NO TYPE STUB AVAILABLE.
[[tool.mypy.overrides]]
# msal and msal-extensions ship no py.typed marker and have no stub package on PyPI
module = ["msal", "msal.*", "msal_extensions", "msal_extensions.*"]
ignore_missing_imports = true

[tool.vulture]
paths = [
    "src",
    "scripts",
]
min_confidence = 60
# because this is a library, vulture falsely flags public functions which are never
# called. skip public names (one that does not start with "_").
ignore_names = ["[!_]*"]
