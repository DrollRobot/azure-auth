[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { azure_auth = ["py.typed"] }

[project]
name = "azure-auth"
version = "0.1.0"
description = "A collection of clients and helper functions for authentication with Azure, Graph, Exchange, and other Microsoft cloud systems."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # FIXME add depencencies
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",  # GHSA-xvg9-69gf-fjrf
    "mkdocstrings[python]>=1.0.4,<2",
]
test = [
    "pytest>=9.0.3,<10",  # GHSA-6w46-j5rx-g56g
    "pytest-cov>=7.1,<8",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    "debugpy>=1.8,<2",
    "detect-secrets>=1.5,<2",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15,<1",
    #"other-project", # FIXME add any local/github dependencies here
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",  # GHSA-g6cj-pr64-35w5; prune when upstream requires it
]

[tool.uv.sources]
# FIXME add any local/github dependencies here.
# other-project = { git = "https://github.com/USERNAME/other-project.git", tag = "v1.2.3" }
# other-project = { path = "/PATH/TO/PROJECT", editable = true }

[project.scripts]
azure-auth = "azure_auth.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=azure_auth",
    "--cov-report=term-missing",
    "--cov-fail-under=0", # FIXME: coverage disabled for template. update for your project.
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    # Scope
    "unit: single function/class in isolation; all dependencies mocked or stubbed",
    "integration: multiple real components wired together across a boundary",
    "e2e: whole application end to end, driven like a real user",
    # Purpose
    "smoke: fast 'is it fundamentally broken' check",
    "regression: guards against reintroduction of a previously fixed bug",
    "acceptance: verifies behavior against a requirement or user-facing spec",
    "functional: tests behavior/output of a feature without regard to internal structure",
    # Dependency
    "live: requires a real external resource (network, live tenant, secrets, third-party API)",
    "destructive_local: mutates the host/device; guarded to prevent accidental execution",
    "destructive_remote: mutates a remote/external system; guarded to prevent accidental execution",
    # Performance
    "slow: long-running",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = ["scripts"]

